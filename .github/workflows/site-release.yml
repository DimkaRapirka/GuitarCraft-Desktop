name: Publish release data to the site
# Keeps site/release.json (what the download page shows) and site/latest.json
# (a mirror of the updater manifest) in step with the newest GitHub release.
on:
  release:
    types: [published, edited]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: site-release
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Write release data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases/latest" \
            --jq '{tag_name, html_url, published_at, assets: [.assets[] | {name, size, browser_download_url}]}' > site/release.json
          gh release download --repo "${GITHUB_REPOSITORY}" --pattern latest.json --output site/latest.json --clobber \
            || echo "no latest.json on the newest release"
      - name: Commit when changed
        run: |
          set -euo pipefail
          if git diff --quiet -- site/release.json site/latest.json; then echo "up to date"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/release.json site/latest.json
          git commit -m "Site: release data for $(jq -r .tag_name site/release.json)"
          git pull --rebase origin main
          git push origin HEAD:main
