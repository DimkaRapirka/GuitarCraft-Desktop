[package]
name = "gc-ui"
version = "0.11.2"
edition = "2021"
description = "GuitarCraft WebView interface in Rust/WebAssembly"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
gc-model = { path = "../gc-model" }
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = "1"
serde_json = "1"
serde-wasm-bindgen = "0.6"
web-sys = { version = "0.3", features = [
  "Window", "Document", "Element", "HtmlElement", "HtmlInputElement", "HtmlSelectElement",
  "HtmlButtonElement", "HtmlImageElement", "HtmlCanvasElement", "CanvasRenderingContext2d",
  "Blob", "Url", "ImageData", "Node", "NodeList", "HtmlCollection", "Text", "Event", "EventTarget", "CustomEvent", "CustomEventInit",
  "PointerEvent", "MouseEvent", "KeyboardEvent", "WheelEvent", "DomRect", "DomTokenList",
  "CssStyleDeclaration", "Storage", "Performance", "console", "AddEventListenerOptions", "EventInit", "MouseEventInit", "KeyboardEventInit", "PointerEventInit",
  "ResizeObserver", "ScrollIntoViewOptions", "ScrollLogicalPosition",
] }
